<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <link rel="preload" as="fetch" crossorigin href="archive/archive_files.json">
  <link rel="preload" as="fetch" crossorigin href="PuzzleProto_wasm.js">
  <link rel="preload" as="fetch" crossorigin href="PuzzleProto.wasm">
  <script id="poki-sdk-fallback">
		// The poki-sdk extension adds its own SDK script tag and start-up script to this page. Its start-up
		// waits for the SDK script's load event, so if the SDK is blocked (ad blocker, offline) the game
		// would never start. This catches that load error and starts the game without the SDK (A42).
		// runFunc and isPokiSDKInited are the extension's globals; it also waits for the wasm itself.
		var pokiSdkFailed = false;
		var pokiFallbackDone = false;
		function pokiStartWithoutSdk() {
			// Once only: runFunc itself has no guard against starting the engine twice.
			if (pokiSdkFailed && !pokiFallbackDone && typeof runFunc === 'function') {
				pokiFallbackDone = true;
				isPokiSDKInited = true;
				runFunc();
			}
		}
		window.addEventListener('error', function(event) {
			var target = event.target;
			if (target && target.tagName === 'SCRIPT' && target.src && target.src.indexOf('poki-sdk.js') !== -1) {
				pokiSdkFailed = true;
				pokiStartWithoutSdk();
			}
		}, true);
		// The error can come before the extension's script has run; try again once the page is loaded.
		window.addEventListener('load', pokiStartWithoutSdk);
	</script>
  <title>PuzzleProto</title>
  <style>
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		/* ui.COLOR_BACKGROUND, so the page and the cleared canvas match while loading. */
		background-color: #181a22;
	}

	body {
		position: fixed; /* Prevent overscroll */
		overscroll-behavior: none;
	}

	/* Disable user selection: in Chrome on Windows, dragging selected text outside the
	   canvas blocks mouse down/up events to the engine. */
	body, div {
		-webkit-tap-highlight-color: rgba(0,0,0,0);
		-webkit-touch-callout: none;
		-webkit-user-select: none;
		-moz-user-select: none;
		user-select: none;
	}

	#app-container {
		width: 100%;
		height: 100%;
		position: absolute;
		overflow: hidden;
	}

	#canvas-container {
		position: relative;
	}

	#canvas {
		outline: none;
		border: 0;
		width: 100%;
		vertical-align: bottom;
		/* Touches go to the game, never to page scrolling or zooming. */
		touch-action: none;
	}

	#webgl-not-supported {
		display: none;
		margin: 3em;
		color: #f0f0f5;
		font-family: sans-serif;
	}

	.canvas-app-progress {
		position: absolute;
		background-color: #30344a;
		height: 6px;
		margin-top: -6px;
		width: 100%;
	}

	.canvas-app-progress-bar {
		height: 6px;
		background-color: #ffbe46;
		transition: transform 1s ease;
		transform-origin: left;
		transform: scaleX(1.0);
	}
	</style>
  <link rel="dns-prefetch" href="//api.poki.com">
  <link rel="dns-prefetch" href="//a.poki-cdn.com">
  <script defer src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js" onload="poki_sdk_loaded()"></script>
 </head>
 <body>
  <div id="app-container">
   <div id="webgl-not-supported">
    <h1>WebGL is not supported</h1>
    <p>Your browser can't run this game. Try another browser, or turn on hardware acceleration.</p>
   </div>
   <div id="canvas-container">
    <canvas id="canvas" tabindex="1" width="1280" height="720"></canvas>
   </div>
  </div>
  <script id="prevent-page-scroll">
		// On Poki the game sits in an iframe on a longer page. Keys, the wheel and touches that
		// would scroll that page must not (A6). The engine still receives every event.
		(function() {
			var scrollKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'PageUp', 'PageDown', 'Home', 'End'];
			window.addEventListener('keydown', function(event) {
				if (scrollKeys.indexOf(event.key) !== -1) {
					event.preventDefault();
				}
			});
			window.addEventListener('wheel', function(event) {
				event.preventDefault();
			}, { passive: false });
			window.addEventListener('touchmove', function(event) {
				event.preventDefault();
			}, { passive: false });
		})();
	</script>
  <script id="engine-loader" src="dmloader.js"></script>
  <script id="engine-start">
		EngineLoader.load("canvas", "PuzzleProto");
	</script>
  <script id="poki-sdk-setup" type="text/javascript">
		var isWasmLoaded = false;
		var isPokiSDKInited = false;
		var runFunc = function() {
			if (isPokiSDKInited && isWasmLoaded) {
				Module.runApp("canvas");
			}
		}
		Module['onRuntimeInitialized'] = function() {
			isWasmLoaded = true;
			runFunc();
		};
		function poki_sdk_loaded() {
			var data = {};
			var isLoadFinished = false;
			Progress.addListener(function(percentage){
				data.percentageDone = percentage / 100;
				if (!isLoadFinished)
					PokiSDK.gameLoadingProgress(data);
				if (percentage == 100 && !isLoadFinished) {
					PokiSDK.gameLoadingFinished();
					isLoadFinished = true;
				}
			});
			PokiSDK.init().then(()=>{
					isPokiSDKInited = true;
					runFunc();
				}, ()=>{
					isPokiSDKInited = true;
					runFunc();
				});
		}
	</script>
 </body>
</html>
