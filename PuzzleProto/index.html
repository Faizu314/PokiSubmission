<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, minimal-ui, shrink-to-fit=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<!-- The above 5 meta tags *must* come first in the head; any other head content must come *after* these tags -->

	<link rel="preload" as="fetch" crossorigin href="archive/archive_files.json">
	<link rel="preload" as="fetch" crossorigin href="PuzzleProto_wasm.js">
	<link rel="preload" as="fetch" crossorigin href="PuzzleProto.wasm">

	<title>PuzzleProto</title>
	<style type='text/css'>
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		/* ui.COLOR_BACKGROUND, so the page and the cleared canvas match while loading. */
		background-color: #181a22;
	}

	body {
		position: fixed; /* Prevent overscroll */
		overscroll-behavior: none;
	}

	/* Disable user selection: in Chrome on Windows, dragging selected text outside the
	   canvas blocks mouse down/up events to the engine. */
	body, div {
		-webkit-tap-highlight-color: rgba(0,0,0,0);
		-webkit-touch-callout: none;
		-webkit-user-select: none;
		-moz-user-select: none;
		user-select: none;
	}

	.canvas-app-container {
		width: 100%;
		height: 100%;
		position: absolute;
		overflow: hidden;
	}

	#canvas-container {
		position: relative;
	}

	#canvas {
		outline: none;
		border: 0;
		width: 100%;
		vertical-align: bottom;
		/* Touches go to the game, never to page scrolling or zooming. */
		touch-action: none;
	}

	canvas:focus, canvas:active {
		outline: none;
		border: 0;
	}

	.message {
		display: none;
		margin: 3em;
		color: #f0f0f5;
		font-family: sans-serif;
	}

	.canvas-app-progress {
		position: absolute;
		background-color: #30344a;
		height: 6px;
		margin-top: -6px;
		width: 100%;
	}

	.canvas-app-progress-bar {
		height: 6px;
		background-color: #ffbe46;
		transition: transform 1s ease;
		transform-origin: left;
		transform: scaleX(1.0);
	}
	</style>
</head>

<body>
	<div id="app-container" class="canvas-app-container">
		<div id="running-from-file-warning" class="message">
			<h1>Running from a local file</h1>
			<p>This game has to be loaded from a web server, not opened as a file.</p>
		</div>
		<div id="webgl-not-supported" class="message">
			<h1>WebGL is not supported</h1>
			<p>Your browser can't run this game. Try another browser, or turn on hardware acceleration.</p>
		</div>
		<div id="canvas-container" class="canvas-app-canvas-container">
			<canvas id="canvas" class="canvas-app-canvas" tabindex="1" width="1280" height="720"></canvas>
		</div>
	</div>
	<script>
		// Fallback to make sure globalThis is available in browsers older than Chrome 71.
		if (typeof globalThis === 'undefined') {
			window.globalThis = window;
		}
	</script>
	<script id='prevent-page-scroll' type='text/javascript'>
		// On Poki the game sits in an iframe on a longer page. Keys, the wheel and touches that
		// would scroll that page must not (A6). The engine still receives every event.
		(function() {
			var scrollKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'PageUp', 'PageDown', 'Home', 'End'];
			window.addEventListener('keydown', function(event) {
				if (scrollKeys.indexOf(event.key) !== -1) {
					event.preventDefault();
				}
			});
			window.addEventListener('wheel', function(event) {
				event.preventDefault();
			}, { passive: false });
			window.addEventListener('touchmove', function(event) {
				event.preventDefault();
			}, { passive: false });
		})();
	</script>
	<script id='engine-loader' type='text/javascript' src="dmloader.js"></script>
	<script id='engine-start' type='text/javascript'>
		var runningFromFileWarning = document.getElementById("running-from-file-warning");
		if (window.location.href.startsWith("file://")) {
			runningFromFileWarning.style.display = "block";
		}
		else {
			EngineLoader.load("canvas", "PuzzleProto");
			runningFromFileWarning.parentNode.removeChild(runningFromFileWarning);
		}
	</script>
</body>
</html>
